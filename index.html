<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Álbum dos Passarinhos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦</text></svg>">
  <style>
  :root {
    --bg: #fbf6ea;
    --ink: #2b3a2e;
    --muted: #6b7a6e;
    --accent: #e4572e;
    --leaf: #3f7d58;
    --sky: #cfe8ef;
    --card: #ffffff;
    --radius: 22px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    overflow-x: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }

  /* Login */
  #login {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    padding: 20px;
    place-items: center;
    background: linear-gradient(180deg, var(--sky), var(--bg));
  }

  #login[hidden] {
    display: none;
  }

  .login-card {
    width: min(420px, 100%);
    padding: 32px 28px;
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: 0 18px 50px rgba(43, 58, 46, 0.15);
    text-align: center;
  }

  .login-card svg {
    width: 84px;
    height: 84px;
    margin-bottom: 8px;
  }

  .login-card h1 {
    margin-bottom: 4px;
    font-size: 1.6rem;
  }

  .login-card p {
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  label {
    display: block;
    margin: 12px 0 4px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: left;
  }

  input {
    width: 100%;
    padding: 13px 14px;
    border: 2px solid #e3dcc8;
    border-radius: 14px;
    background: #fffdf7;
    color: var(--ink);
    font-size: 1rem;
  }

  input:focus {
    outline: none;
    border-color: var(--leaf);
  }

  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
  }

  button.primary:hover {
    filter: brightness(1.06);
    transform: translateY(-1px);
  }

  button.primary:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  #loginMsg {
    min-height: 1.3em;
    margin-top: 14px;
    color: #b3261e;
    font-size: 0.9rem;
  }

  /* Capa de abertura */
  .hero {
    position: relative;
    display: flex;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 60px 24px 80px;
    background: radial-gradient(ellipse at 50% 0%, var(--sky), transparent 70%);
    text-align: center;
  }

  .hero h1 {
    margin: 18px 0 12px;
    font-size: clamp(2.4rem, 7vw, 5rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }

  .hero h1 span {
    color: var(--accent);
  }

  .hero p {
    max-width: 34ch;
    color: var(--muted);
    font-size: clamp(1.05rem, 2.4vw, 1.35rem);
  }

  .hero .bird {
    width: clamp(110px, 20vw, 190px);
    animation: float 4s ease-in-out infinite;
  }

  .scroll-hint {
    margin-top: 42px;
    color: var(--muted);
    font-size: 0.9rem;
    animation: bounce 1.8s infinite;
  }

  @keyframes float {
    50% {
      transform: translateY(-14px) rotate(-3deg);
    }
  }

  @keyframes bounce {
    50% {
      transform: translateY(8px);
    }
  }

  .cloud {
    position: absolute;
    border-radius: 99px;
    background: #fff;
    opacity: 0.8;
    filter: blur(1px);
  }

  .cloud::before,
  .cloud::after {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    content: "";
  }

  .c1 {
    top: 14%;
    left: -160px;
    width: 140px;
    height: 40px;
    animation: drift 38s linear infinite;
  }

  .c1::before {
    top: -30px;
    left: 20px;
    width: 60px;
    height: 60px;
  }

  .c1::after {
    top: -20px;
    left: 70px;
    width: 46px;
    height: 46px;
  }

  .c2 {
    top: 30%;
    left: -120px;
    width: 100px;
    height: 30px;
    animation: drift 52s linear infinite 8s;
  }

  .c2::before {
    top: -22px;
    left: 14px;
    width: 44px;
    height: 44px;
  }

  .c2::after {
    top: -14px;
    left: 50px;
    width: 34px;
    height: 34px;
  }

  @keyframes drift {
    to {
      transform: translateX(calc(100vw + 320px));
    }
  }

  /* Fotos do álbum */
  #album {
    display: flex;
    flex-direction: column;
  }

  .band {
    display: flex;
    width: 100%;
    justify-content: center;
    padding: clamp(28px, 6vw, 64px) clamp(16px, 5vw, 64px);
  }

  .band:nth-child(even) {
    background: rgba(207, 232, 239, 0.35);
  }

  .band-inner {
    display: grid;
    width: min(1200px, 100%);
    grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(16px, 4vw, 48px);
  }

  .band:nth-child(even) .band-inner {
    grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
  }

  .band:nth-child(even) figure {
    order: 2;
  }

  .photo {
    position: relative;
    display: block;
    width: 100%;
    overflow: hidden;
    padding: 0;
    border: 0;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius);
    background: #e9e1cb;
    box-shadow: 0 14px 40px rgba(43, 58, 46, 0.2);
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    text-align: center;
  }

  .photo:focus-visible,
  .back-button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.8s ease;
  }

  .photo:hover img {
    transform: scale(1.04);
  }

  .photo:disabled {
    cursor: default;
    opacity: 1;
  }

  .photo:disabled:hover img {
    transform: none;
  }

  .photo-empty {
    display: grid;
    width: 100%;
    height: 100%;
    padding: 16px;
    place-items: center;
    color: var(--muted);
  }

  .album-navigation {
    display: flex;
    width: min(1200px, 100%);
    align-items: center;
    gap: 16px;
    margin: 0 auto;
    padding: 28px clamp(16px, 5vw, 64px) 0;
  }

  .album-navigation h2 {
    font-size: clamp(1.4rem, 3vw, 2rem);
  }

  .back-button {
    flex: 0 0 auto;
    padding: 9px 16px;
    border: 2px solid #d8d0b8;
    border-radius: 99px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }

  .project {
    width: min(1200px, calc(100% - 32px));
    margin: 28px auto 0;
    padding: clamp(20px, 4vw, 36px);
    border-radius: var(--radius);
    background: #fff;
    box-shadow: 0 10px 30px rgba(43, 58, 46, 0.1);
  }

  .project h2 {
    margin-bottom: 10px;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
  }

  .project p {
    color: var(--muted);
    white-space: pre-line;
  }

  .child-gallery {
    display: grid;
    width: min(1200px, calc(100% - 32px));
    gap: 24px;
    margin: 28px auto;
  }

  .child-photo {
    display: block;
    width: 100%;
    overflow: hidden;
    padding: 0;
    border: 0;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius);
    background: #e9e1cb;
    box-shadow: 0 14px 40px rgba(43, 58, 46, 0.2);
    cursor: zoom-in;
  }

  .child-photo:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .child-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.25s ease;
  }

  .child-photo:hover img {
    transform: scale(1.03);
  }

  .photo-zoom-dialog {
    width: fit-content;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 24px);
    margin: auto;
    padding: 0;
    border: 0;
    outline: none;
    overflow: visible;
    background: transparent;
  }

  .photo-zoom-dialog::backdrop {
    background: rgba(15, 22, 17, 0.88);
  }

  .photo-zoom-dialog img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 24px);
    object-fit: contain;
  }

  .child-photo .photo-empty {
    height: 100%;
  }

  .child-video {
    overflow: hidden;
    border-radius: var(--radius);
    background: #e9e1cb;
    box-shadow: 0 14px 40px rgba(43, 58, 46, 0.2);
  }

  .child-video video {
    display: block;
    width: 100%;
    max-height: 80vh;
  }

  .caption {
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 700;
    line-height: 1.15;
  }

  .caption small {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 400;
  }

  .num {
    display: inline-grid;
    width: 42px;
    height: 42px;
    margin-bottom: 12px;
    place-items: center;
    border-radius: 50%;
    background: var(--leaf);
    color: #fff;
    font-weight: 700;
  }

  .reveal {
    opacity: 0;
    transform: translateY(60px) scale(0.97);
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .reveal.in {
    opacity: 1;
    transform: none;
  }

  .reveal.delay {
    transition-delay: 0.18s;
  }

  @media (max-width: 720px) {
    .band-inner,
    .band:nth-child(even) .band-inner {
      grid-template-columns: 1fr;
    }

    .band:nth-child(even) figure {
      order: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }

    .reveal {
      opacity: 1;
      transform: none;
    }
  }

  /* Mensagens e rodapé */
  .state {
    padding: 60px 24px;
    color: var(--muted);
    font-size: 1.1rem;
    text-align: center;
  }

  footer {
    padding: 48px 20px 64px;
    color: var(--muted);
    font-size: 0.95rem;
    text-align: center;
  }

  footer button {
    margin-top: 14px;
    padding: 8px 18px;
    border: 2px solid #d8d0b8;
    border-radius: 99px;
    background: none;
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
  }

  footer button:hover {
    border-color: var(--leaf);
    color: var(--leaf);
  }

  /* Controle da música */
  #btnMusica {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border: 2px solid #d8d0b8;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.92);
    color: var(--ink);
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(43, 58, 46, 0.18);
    backdrop-filter: blur(6px);
    transition: border-color 0.2s, transform 0.15s;
  }

  #btnMusica:hover {
    border-color: var(--leaf);
    transform: translateY(-1px);
  }

  #btnMusica[aria-pressed="true"] {
    border-color: var(--leaf);
  }

  #btnMusica .i {
    font-size: 1.1rem;
  }
  </style>
</head>
<body>

  <!-- Acesso ao álbum -->
  <section id="login" hidden>
    <form class="login-card" id="loginForm">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <use href="#bird" />
      </svg>
      <h1>Álbum dos Passarinhos</h1>
      <p>Entre com o e-mail e a senha que a escola enviou.</p>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button class="primary" id="btnEntrar" type="submit">Entrar</button>
      <div id="loginMsg" role="alert"></div>
    </form>
  </section>

  <!-- Álbum -->
  <main id="app" hidden>
    <header class="hero">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <svg class="bird" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#bird" />
      </svg>
      <h1>Projeto <span>Passarinhada</span></h1>
      <p>Um álbum feito com muito carinho pelas crianças da nossa sala.</p>
      <div class="scroll-hint">role para baixo ↓</div>
    </header>

    <section id="album" aria-live="polite"></section>

    <footer>
      <div>Feito com carinho pela turma 🐦</div>
      <button id="btnSair" type="button" hidden>Sair</button>
    </footer>
  </main>

  <button
    id="btnMusica"
    type="button"
    aria-pressed="false"
    aria-label="Ligar ou desligar a música"
  >
    <span class="i">🔇</span>
    <span class="t">Música: desligada</span>
  </button>

  <dialog class="photo-zoom-dialog" id="photoZoom">
    <img alt="">
  </dialog>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="bird" viewBox="0 0 100 100">
      <ellipse cx="50" cy="58" rx="30" ry="25" fill="#e4572e" />
      <circle cx="68" cy="38" r="16" fill="#e4572e" />
      <path d="M82 36 L98 41 L82 46 Z" fill="#f4b942" />
      <circle cx="72" cy="35" r="3.2" fill="#2b3a2e" />
      <circle cx="73" cy="34" r="1" fill="#fff" />
      <path d="M22 52 L2 38 L8 62 L24 66 Z" fill="#3f7d58" />
      <path d="M38 55 Q52 40 64 62 Q50 74 38 55 Z" fill="#c8431f" />
      <path
        d="M44 82 L44 92 M56 82 L56 92"
        stroke="#f4b942"
        stroke-width="3"
        stroke-linecap="round"
      />
    </symbol>
  </svg>

  <script>
  const Musica = (() => {
    const BPM = 112;
    const PASSO = 60 / BPM / 2;
    const VOLUME = 0.5;
    const hz = (nota) => 440 * Math.pow(2, (nota - 69) / 12);

    const COMPASSOS = [
      { baixo: 48, acorde: [60, 64, 67] },
      { baixo: 43, acorde: [59, 62, 67] },
      { baixo: 45, acorde: [60, 64, 69] },
      { baixo: 41, acorde: [60, 65, 69] }
    ];

    const MELODIA = [
      [
        [76, 0, 79, 76, 72, 74, 76, 0],
        [74, 0, 79, 74, 71, 74, 79, 0],
        [72, 0, 76, 72, 69, 72, 76, 0],
        [77, 0, 81, 77, 72, 74, 76, 79]
      ],
      [
        [79, 0, 76, 79, 84, 0, 79, 0],
        [79, 0, 74, 79, 83, 0, 79, 0],
        [81, 0, 76, 81, 84, 81, 76, 0],
        [77, 0, 81, 84, 81, 77, 74, 0]
      ]
    ];

    let ctx = null;
    let master = null;
    let ruido = null;
    let ligada = false;
    let timer = null;
    let tSuspende = null;
    let proximo = 0;
    let passo = 0;
    let tPio = 0;

    function montar() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return false;

      ctx = new AudioContext();
      master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);

      ruido = ctx.createBuffer(
        1,
        Math.floor(ctx.sampleRate * 0.05),
        ctx.sampleRate
      );
      const amostras = ruido.getChannelData(0);

      for (let i = 0; i < amostras.length; i++) {
        amostras[i] = Math.random() * 2 - 1;
      }

      return true;
    }

    function nota(frequencia, tempo, duracao, intensidade, tipo) {
      const oscilador = ctx.createOscillator();
      const volume = ctx.createGain();

      oscilador.type = tipo;
      oscilador.frequency.value = frequencia;
      volume.gain.setValueAtTime(0.0001, tempo);
      volume.gain.exponentialRampToValueAtTime(intensidade, tempo + 0.008);
      volume.gain.exponentialRampToValueAtTime(0.0001, tempo + duracao);
      oscilador.connect(volume);
      volume.connect(master);
      oscilador.start(tempo);
      oscilador.stop(tempo + duracao + 0.05);
    }

    function tique(tempo) {
      const fonte = ctx.createBufferSource();
      const filtro = ctx.createBiquadFilter();
      const volume = ctx.createGain();

      fonte.buffer = ruido;
      filtro.type = "highpass";
      filtro.frequency.value = 6000;
      volume.gain.value = 0.018;
      fonte.connect(filtro);
      filtro.connect(volume);
      volume.connect(master);
      fonte.start(tempo);
    }

    function piar(tempo) {
      const frequenciaBase = 2600 + Math.random() * 1400;
      const quantidade = 2 + Math.floor(Math.random() * 2);

      for (let i = 0; i < quantidade; i++) {
        const inicio = tempo + i * 0.13;
        const frequencia = frequenciaBase * (1 + i * 0.06);
        const oscilador = ctx.createOscillator();
        const volume = ctx.createGain();

        oscilador.type = "sine";
        oscilador.frequency.setValueAtTime(frequencia, inicio);
        oscilador.frequency.exponentialRampToValueAtTime(
          frequencia * 1.3,
          inicio + 0.07
        );
        volume.gain.setValueAtTime(0.0001, inicio);
        volume.gain.exponentialRampToValueAtTime(0.045, inicio + 0.012);
        volume.gain.exponentialRampToValueAtTime(0.0001, inicio + 0.09);
        oscilador.connect(volume);
        volume.connect(master);
        oscilador.start(inicio);
        oscilador.stop(inicio + 0.11);
      }
    }

    function tocar(passo, tempo) {
      const frase = Math.floor(passo / 32) % 2;
      const numeroCompasso = Math.floor(passo / 8) % 4;
      const posicao = passo % 8;
      const compasso = COMPASSOS[numeroCompasso];
      const notaMelodica = MELODIA[frase][numeroCompasso][posicao];

      if (notaMelodica) {
        nota(hz(notaMelodica), tempo, 0.5, 0.16, "triangle");
        nota(hz(notaMelodica) * 4, tempo, 0.1, 0.03, "sine");
      }

      if (posicao === 0 || posicao === 4) {
        nota(hz(compasso.baixo), tempo, 0.35, 0.16, "triangle");
      }

      if (posicao === 2 || posicao === 6) {
        compasso.acorde.forEach((frequencia, indice) => {
          nota(
            hz(frequencia),
            tempo + indice * 0.012,
            0.22,
            0.045,
            "triangle"
          );
        });
      }

      if (posicao % 2 === 1) tique(tempo);

      if (passo >= tPio && posicao === 3) {
        piar(tempo);
        tPio = passo + 24 + Math.floor(Math.random() * 24);
      }
    }

    function agendar() {
      while (proximo < ctx.currentTime + 0.25) {
        tocar(passo, proximo);
        proximo += PASSO;
        passo++;
      }
    }

    let iniciando = false;

    async function ligar() {
      if (ligada) return true;
      if (iniciando) return false;
      if (!ctx && !montar()) return false;

      iniciando = true;
      clearTimeout(tSuspende);

      try {
        await Promise.race([
          ctx.resume(),
          new Promise((resolver) => setTimeout(resolver, 700))
        ]);
      } catch (erro) {}

      iniciando = false;

      // Sem toque válido ainda: tenta de novo no próximo toque.
      if (ctx.state !== "running") return false;

      ligada = true;
      passo = 0;
      tPio = 16;
      proximo = ctx.currentTime + 0.1;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(VOLUME, ctx.currentTime, 0.3);
      timer = setInterval(agendar, 80);

      return true;
    }

    function desligar() {
      if (!ligada) return;

      ligada = false;
      clearInterval(timer);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.2);
      tSuspende = setTimeout(() => {
        if (!ligada) ctx.suspend();
      }, 1500);
    }

    return { ligar, desligar, get ligada() { return ligada; } };
  })();

  (function iniciarBotaoMusica() {
    const botao = document.getElementById("btnMusica");
    const CHAVE_MUSICA = "album_musica";

    const salvarPreferencia = (valor) => {
      try {
        localStorage.setItem(CHAVE_MUSICA, valor);
      } catch (erro) {}
    };

    const lerPreferencia = () => {
      try {
        return localStorage.getItem(CHAVE_MUSICA);
      } catch (erro) {
        return null;
      }
    };

    const atualizarBotao = () => {
      botao.setAttribute("aria-pressed", Musica.ligada ? "true" : "false");
      botao.querySelector(".t").textContent = Musica.ligada
        ? "Música: ligada"
        : "Música: desligada";
      botao.querySelector(".i").textContent = Musica.ligada ? "🔊" : "🔇";
    };

    document.addEventListener("album:video-iniciado", () => {
      Musica.desligar();
      salvarPreferencia("off");
      atualizarBotao();
    });

    botao.addEventListener("click", async () => {
      if (Musica.ligada) {
        Musica.desligar();
        salvarPreferencia("off");
      } else {
        if (await Musica.ligar()) salvarPreferencia("on");
      }

      atualizarBotao();
    });

    atualizarBotao();

    if (lerPreferencia() === "off") return;

    const EVENTOS = ["pointerup", "touchend", "click", "keydown"];

    const iniciarMusica = async (evento) => {
      if (
        evento.target &&
        evento.target.closest &&
        evento.target.closest("#btnMusica")
      ) {
        return;
      }

      if (await Musica.ligar()) {
        EVENTOS.forEach((tipo) => {
          document.removeEventListener(tipo, iniciarMusica, true);
        });
        atualizarBotao();
      }
    };

    EVENTOS.forEach((tipo) => {
      document.addEventListener(tipo, iniciarMusica, true);
    });
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

  const SUPABASE_URL = "https://onvsyopaxskqpvdcctcp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_C7D_EQn_oKNm2Vnbh6RAXQ_fe2LRtA5";
  const BUCKET = "album";
  const EXTENSAO_IMAGEM = /\.(jpe?g|png|webp|gif|avif)$/i;
  const EXTENSAO_VIDEO = /\.(mp4|webm|ogv|ogg)$/i;
  let tokenRenderizacao = 0;


  const PROJETOS = {
    "TURMA/Bernardo Antonio": "Bernardo Antonio fez uma pesquisa sobre o Pelicano.",
    "TURMA/Bernardo Fortunato": "Bernardo Fortunato fez uma pesquisa sobre a Cegonha",
    "TURMA/Enzo": "Enzo fez uma pesquisa sobre o Pica-pau",
    "TURMA/Esther": "Esther fez uma pesquisa sobre o Tucano",
    "TURMA/Gael": "Gael fez uma pesquisa sobre o Bico-de-sapato",
    "TURMA/Heitor": "Heitor fez uma pesquisa sobre o Beija-flor",
    "TURMA/Helena": "Helena fez uma pesquisa sobre o Beija-flor",
    "TURMA/Henry": "Henry fez uma pesquisa sobre o Azulão",
    "TURMA/Joaquim": "Joaquim fez uma pesquisa sobre o Beija-flor",
    "TURMA/Jose Felipe": "Jose Felipe fez uma pesquisa sobre a Maritaca e também sobre o Pavão",
    "TURMA/Liz": "Liz fez uma pesquisa sobre a Tesourinha",
    "TURMA/Manuela": "Manuela fez uma pesquisa sobre o Beija-flor",
    "TURMA/Maria Clara": "Maria Clara fez uma pesquisa sobre Tucano",
    "TURMA/Maria Eduarda": "Maria Eduarda fez uma pesquisa sobre o Bem-te-vi",
    "TURMA/Marianne": "Marianne fez uma pesquisa sobre a Maritaca",
    "TURMA/Matheus": "Matheus fez uma pesquisa sobre a Águia",
    "TURMA/Rafael": "Rafael fez uma pesquisa sobre o Canarinho",
    "TURMA/Sophia": "Sophia fez uma pesquisa sobre a Coruja",
    "TURMA/Vitor": "Vitor fez uma pesquisa sobre o João-de-barro"
  };

  const $ = (id) => document.getElementById(id);
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const photoZoom = $("photoZoom");

  history.replaceState({ albumPath: [] }, "", location.href);

  function ampliarFoto(url, textoAlternativo) {
    const imagemAmpliada = photoZoom.querySelector("img");
    imagemAmpliada.src = url;
    imagemAmpliada.alt = textoAlternativo;
    photoZoom.showModal();
  }

  photoZoom.addEventListener("cancel", (evento) => {
    evento.preventDefault();
    photoZoom.close();
  });
  photoZoom.addEventListener("click", (evento) => {
    if (evento.target === photoZoom) photoZoom.close();
  });
  photoZoom.addEventListener("close", () => {
    photoZoom.querySelector("img").removeAttribute("src");
  });

  window.addEventListener("popstate", (evento) => {
    const caminho = Array.isArray(evento.state?.albumPath)
      ? evento.state.albumPath
      : [];
    abrirPasta(caminho);
  });


  async function loginPeloQR() {
    if (!location.hash || location.hash.length < 3) return false;

    const parametros = new URLSearchParams(location.hash.slice(1));
    const email = parametros.get("a");
    const senha = parametros.get("k");

    if (!email || !senha) return false;

    history.replaceState(null, "", location.pathname + location.search);
    const { error } = await sb.auth.signInWithPassword({
      email,
      password: senha
    });

    return !error;
  }

  $("loginForm").addEventListener("submit", async (evento) => {
    evento.preventDefault();

    const botao = $("btnEntrar");
    const mensagem = $("loginMsg");
    botao.disabled = true;
    mensagem.textContent = "";

    const { error } = await sb.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("senha").value
    });

    botao.disabled = false;

    if (error) {
      mensagem.textContent = "E-mail ou senha incorretos. Tente novamente.";
      return;
    }

    $("login").hidden = true;
    $("app").hidden = false;
    await abrirPasta([]);
  });

  $("btnSair").addEventListener("click", async () => {
    await sb.auth.signOut();
    location.reload();
  });

  function legenda(nomeArquivo) {
    let texto = nomeArquivo
      .replace(/\.[^.]+$/, "")
      .replace(/^\d+[\s._-]*/, "")
      .replace(/[_-]+/g, " ")
      .trim();

    if (!texto) texto = "Passarinho";

    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  async function listarPasta(caminho) {
    const { data, error } = await sb.storage
      .from(BUCKET)
      .list(caminho, {
        limit: 500,
        sortBy: { column: "name", order: "asc" }
      });

    if (error) {
      throw new Error(error.message || String(error));
    }

    return data || [];
  }

  function ehImagem(arquivo) {
    return Boolean(arquivo.id && EXTENSAO_IMAGEM.test(arquivo.name));
  }

  function ehVideo(arquivo) {
    return Boolean(arquivo.id && EXTENSAO_VIDEO.test(arquivo.name));
  }

  function ehPasta(arquivo) {
    return !arquivo.id && !EXTENSAO_IMAGEM.test(arquivo.name);
  }

  function mesmaChave(a, b) {
    return a.trim().toLocaleLowerCase("pt-BR") === b.trim().toLocaleLowerCase("pt-BR");
  }

  function caminhoDoArquivo(caminho, nome) {
    return caminho ? `${caminho}/${nome}` : nome;
  }

  function navegarParaPasta(caminho) {
    history.pushState({ albumPath: caminho }, "", location.href);
    return abrirPasta(caminho);
  }

  function criarCartao(nome, foto, descricao, aoClicar, indice) {
    const faixa = document.createElement("div");
    faixa.className = "band";
    faixa.innerHTML = `
      <div class="band-inner">
        <figure class="reveal">
          <button class="photo" type="button">
            <span class="photo-empty">Foto não encontrada</span>
          </button>
        </figure>
        <div class="reveal delay">
          <div class="num"></div>
          <div class="caption">
            <span class="caption-title"></span>
            <small></small>
          </div>
        </div>
      </div>`;

    const botaoFoto = faixa.querySelector(".photo");
    if (foto) {
      const imagem = document.createElement("img");
      imagem.src = foto.url;
      imagem.alt = nome;
      imagem.loading = "lazy";
      botaoFoto.replaceChildren(imagem);
    }

    botaoFoto.setAttribute("aria-label", aoClicar ? `Abrir ${nome}` : nome);
    botaoFoto.disabled = !aoClicar;
    if (aoClicar) botaoFoto.addEventListener("click", aoClicar);
    faixa.querySelector(".num").textContent = indice + 1;
    faixa.querySelector(".caption-title").textContent = nome;
    faixa.querySelector("small").textContent = descricao;
    return faixa;
  }

  function mostrarNavegacao(area, caminho) {
    const navegacao = document.createElement("div");
    navegacao.className = "album-navigation";

    if (caminho.length) {
      const voltar = document.createElement("button");
      voltar.className = "back-button";
      voltar.type = "button";
      voltar.textContent = "← Voltar";
      voltar.addEventListener("click", () => history.back());
      navegacao.appendChild(voltar);
    }

    const titulo = document.createElement("h2");
    titulo.textContent = caminho.length
      ? legenda(caminho[caminho.length - 1])
      : "Álbum da turma";
    navegacao.appendChild(titulo);
    area.appendChild(navegacao);
  }

  async function abrirPasta(caminho) {
    const token = ++tokenRenderizacao;
    const area = $("album");
    area.innerHTML = '<div class="state">Carregando as fotos… 🐦</div>';

    try {
      const arquivos = await listarPasta(caminho.join("/"));
      if (token !== tokenRenderizacao) return;
      area.innerHTML = "";
      mostrarNavegacao(area, caminho);

      if (caminho.length === 0) {
        const imagens = arquivos.filter(ehImagem);
        const pastas = arquivos.filter(ehPasta);
        if (!imagens.length) {
          area.insertAdjacentHTML("beforeend", '<div class="state">Em breve as fotos aparecerão aqui! 🌱</div>');
          return;
        }

        imagens.forEach((arquivo, indice) => {
          const nome = legenda(arquivo.name);
          const nomePasta = arquivo.name.replace(/\.[^.]+$/, "");
          const pasta = pastas.find((item) => mesmaChave(item.name, nomePasta));
          const url = sb.storage.from(BUCKET).getPublicUrl(arquivo.name).data.publicUrl;
          area.appendChild(criarCartao(
            nome,
            { url },
            "Toque na foto para ver as crianças",
            () => navegarParaPasta([pasta ? pasta.name : nomePasta]),
            indice
          ));
        });
      } else if (caminho.length === 1) {
        const pastas = arquivos.filter(ehPasta);
        const criancas = await Promise.all(pastas.map(async (pasta) => {
          const caminhoCrianca = caminhoDoArquivo(caminho.join("/"), pasta.name);
          const conteudo = await listarPasta(caminhoCrianca);
          const primeiraFoto = conteudo.find(ehImagem);
          return {
            nome: legenda(pasta.name),
            caminho: caminhoCrianca,
            foto: primeiraFoto
              ? { url: sb.storage.from(BUCKET).getPublicUrl(caminhoDoArquivo(caminhoCrianca, primeiraFoto.name)).data.publicUrl }
              : null
          };
        }));

        if (token !== tokenRenderizacao) return;
        if (!criancas.length) {
          area.insertAdjacentHTML("beforeend", '<div class="state">Ainda não há pastas de crianças nesta turma.</div>');
          return;
        }

        criancas.forEach((crianca, indice) => {
          area.appendChild(criarCartao(
            crianca.nome,
            crianca.foto,
            "Toque para ver o projeto e as fotos",
            () => navegarParaPasta([...caminho, crianca.caminho.split("/").pop()]),
            indice
          ));
        });
      } else {
        const nomeCrianca = legenda(caminho[caminho.length - 1]);
        const chaveProjeto = caminho.join("/");
        const descricaoProjeto = Object.entries(PROJETOS).find(([chave]) =>
          mesmaChave(chave, chaveProjeto)
        );
        const projeto = document.createElement("section");
        projeto.className = "project";
        const tituloProjeto = document.createElement("h2");
        tituloProjeto.textContent = "Projeto";
        const textoProjeto = document.createElement("p");
        textoProjeto.textContent = descricaoProjeto
          ? descricaoProjeto[1]
          : "Adicione a descrição deste projeto no objeto PROJETOS, no index.html.";
        projeto.append(tituloProjeto, textoProjeto);
        area.appendChild(projeto);

        const imagens = arquivos.filter(ehImagem);
        const videos = arquivos.filter(ehVideo);
        const midias = document.createElement("div");
        midias.className = "child-gallery";
        imagens.forEach((arquivo) => {
          const caminhoFoto = caminhoDoArquivo(caminho.join("/"), arquivo.name);
          const url = sb.storage.from(BUCKET).getPublicUrl(caminhoFoto).data.publicUrl;
          const figura = document.createElement("button");
          figura.className = "child-photo reveal";
          figura.type = "button";
          figura.setAttribute("aria-label", `Ampliar foto de ${nomeCrianca}`);
          const imagem = document.createElement("img");
          imagem.src = url;
          imagem.alt = `Foto de ${nomeCrianca}`;
          imagem.loading = "lazy";
          figura.addEventListener("click", () => ampliarFoto(url, imagem.alt));
          imagem.addEventListener("error", () => {
            const aviso = document.createElement("span");
            aviso.className = "photo-empty";
            aviso.textContent = "Não foi possível carregar esta foto. Confira o arquivo e a pasta no Supabase.";
            figura.replaceChildren(aviso);
          }, { once: true });
          figura.appendChild(imagem);
          midias.appendChild(figura);
        });

        videos.forEach((arquivo) => {
          const caminhoVideo = caminhoDoArquivo(caminho.join("/"), arquivo.name);
          const url = sb.storage.from(BUCKET).getPublicUrl(caminhoVideo).data.publicUrl;
          const figura = document.createElement("figure");
          figura.className = "child-video reveal";
          const video = document.createElement("video");
          video.src = url;
          video.controls = true;
          video.preload = "metadata";
          video.playsInline = true;
          video.setAttribute("aria-label", `Vídeo de ${nomeCrianca}`);
          video.addEventListener("play", () => {
            document.dispatchEvent(new Event("album:video-iniciado"));
          });
          video.addEventListener("error", () => {
            const aviso = document.createElement("figcaption");
            aviso.className = "photo-empty";
            aviso.textContent = "Não foi possível carregar este vídeo. Confira se o arquivo é MP4 ou WebM e está na pasta da criança.";
            figura.replaceChildren(aviso);
          }, { once: true });
          figura.appendChild(video);
          midias.appendChild(figura);
        });

        if (!imagens.length && !videos.length) {
          area.insertAdjacentHTML("beforeend", '<div class="state">Ainda não há fotos ou vídeos para esta criança.</div>');
        } else {
          area.appendChild(midias);
        }
      }

      observarReveal(area);
    } catch (erro) {
      console.error("Erro ao carregar esta parte do álbum:", erro);
      area.innerHTML = "";
      mostrarNavegacao(area, caminho);
      const estado = document.createElement("div");
      estado.className = "state";
      estado.textContent = `Não foi possível carregar esta parte do álbum. Detalhe: ${erro.message}`;
      area.appendChild(estado);
    }
  }

  function observarReveal(area) {
    const observador = new IntersectionObserver(
      (entradas) => {
        entradas.forEach((entrada) => {
          if (entrada.isIntersecting) {
            entrada.target.classList.add("in");
            observador.unobserve(entrada.target);
          }
        });
      },
      { threshold: 0.18, rootMargin: "0px 0px -6% 0px" }
    );

    area.querySelectorAll(".reveal").forEach((item) => {
      observador.observe(item);
    });
  }

  (async function iniciarPagina() {
    if (SUPABASE_URL.startsWith("COLE_AQUI") || SUPABASE_ANON_KEY.startsWith("COLE_AQUI")) {
      $("app").hidden = false;
      $("album").innerHTML =
        '<div class="state">Falta configurar a chave do Supabase (SUPABASE_ANON_KEY) no index.html.</div>';
      return;
    }

    $("login").hidden = true;
    $("app").hidden = false;
    await abrirPasta([]);
  })();
</script>
